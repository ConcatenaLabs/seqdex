syntax = "proto3";

// SeqOB — the Sequentia peer-to-peer order-book DEX wire schema.
//
// A resting offer is a SIGNED price/size/expiry intent, never a PSET and never
// named UTXOs (online orders). The settlement transaction (same-chain) or HTLC
// legs (cross-chain / Lightning) are built only at lift time, so the joint
// confidential blinding can use both parties' data. The non-custodial relay
// stores and serves these signed offers; it never holds funds.
package seqob.v1;

message AssetPair {
  string base_asset  = 1; // hex asset id; for cross-chain/LN one side is the BTC sentinel id
  string quote_asset = 2;
  // Book NAMESPACE selector, used ONLY on a market_subscribe/market_unsubscribe: false
  // (default) is the transparent book, true is the separate confidential/blinded book, so a
  // WS subscriber's snapshot + deltas stay in ONE namespace — the same disjoint split REST
  // serves via ?confidential= and the matcher enforces on crossing. Ignored on an Offer's
  // pair (an offer's own `confidential` field governs which book it rests in).
  bool confidential = 3;
}

enum TradeDir {
  TRADE_DIR_UNSPECIFIED = 0;
  TRADE_DIR_SELL = 1; // maker sells base
  TRADE_DIR_BUY  = 2; // maker buys base
}

// TimeInForce is the incoming order's execution option for the CONTINUOUS auto-cross
// (offer_submit -> the book-walking matcher). It falls out of price-time-priority
// book-walking; Market/Limit are unchanged (GTC). Additive; the proto3 default 0 =
// GTC preserves every existing offer's behavior.
enum TimeInForce {
  // GTC (good-till-cancel / Limit): cross what you can at the limit price or better,
  // then REST the unfilled remainder as a maker order until filled/cancelled/expired.
  // A non-allow_partial GTC order is all-or-nothing-then-REST (unchanged behavior).
  TIME_IN_FORCE_UNSPECIFIED = 0;
  // IOC (immediate-or-cancel): cross what you can NOW, then CANCEL the remainder — it
  // never rests. A Market order is IOC at any price.
  TIME_IN_FORCE_IOC = 1;
  // FOK (fill-or-kill): all-or-nothing IMMEDIATELY. If the crossing liquidity cannot
  // fill the WHOLE incoming at once, execute NOTHING and cancel (never rest a partially
  // unfilled order). Differs from a non-allow_partial GTC only in that it CANCELS
  // instead of resting.
  TIME_IN_FORCE_FOK = 2;
  // POST_ONLY: rest-only. If the incoming would TAKE (cross) any resting order, REJECT
  // it (execute nothing, do not rest); otherwise rest as a pure maker order.
  TIME_IN_FORCE_POST_ONLY = 3;
}

// Offer is the signed, self-contained intent. The authoritative exchange ratio
// is want_amount/offer_amount (integers); there is deliberately no float price
// field in the signed bytes (clients derive a display price). Offers are keyed
// by (maker_pubkey, offer_id), so offer_id need only be unique per maker.
message Offer {
  string offer_id        = 1;
  uint32 schema_version  = 2;  // = 1
  AssetPair pair         = 3;
  TradeDir trade_dir     = 4;

  uint64 base_amount     = 5;  // total size in base atoms
  uint64 offer_amount    = 6;  // exact atoms the maker gives
  string offer_asset     = 7;  // hex (= base or quote per trade_dir)
  uint64 want_amount     = 8;  // exact atoms the maker wants in return
  string want_asset      = 9;  // hex
  bool   allow_partial   = 10;
  uint64 min_fill        = 11; // min base atoms per lift (anti-dust)

  uint64 created_at_unix = 12;
  uint64 expires_at_unix = 13; // mandatory; a suppressed cancel self-heals when this passes

  string maker_pubkey    = 14; // 33-byte compressed hex; offer identity + signing key
  string fee_asset_hint  = 15; // open fee market: hint only, never privileged (Principle 4)

  // Anchor-depth finality (shared by cross-chain + Lightning settlement): the
  // Bitcoin-anchor confirmations the MAKER wants on a settling tx before the order
  // is marked FILLED. Per-offer, MAKER-controlled, DEFAULT 0 — the DEX is
  // 0-conf-tolerant and does NOT enforce a floor (users self-protect; exchanges /
  // PoS set their own depth, ~3 anchor confs). Principle 1 still holds (a Sequentia
  // tx is only as final as its Bitcoin anchor): the DEX surfaces that HONESTLY
  // (anchor-aware finality, never "final" at 0-conf) and re-opens an order if its
  // settling tx's anchor is later orphaned (book consistency, not a wait). Makers
  // raise this for their own cross-chain atomicity safety.
  uint32 min_anchor_depth = 16;

  // Reserved for Lightning (unset/ignored before LN phases): the maker's LN
  // endpoint. Declared now so adding LN is additive, not a schema migration.
  string maker_ln_node_pubkey = 17;
  repeated string ln_connect_hints = 18;

  // Execution option for the continuous auto-cross (see TimeInForce). Additive;
  // default 0 = GTC (rest the remainder) so Market/Limit are unchanged. IOC cancels
  // the remainder, FOK is all-or-nothing-then-cancel, POST_ONLY rejects if it would
  // take. Part of the signed canonical bytes, so it is authenticated by maker_sig.
  TimeInForce time_in_force = 24;

  // Confidential book namespace. When true, this offer rests in the SEPARATE
  // BLINDED book and may ONLY cross another confidential offer, so BOTH swap legs
  // are CT-blinded on-chain (blinded amounts + assets + rangeproofs on every swap
  // output). This is REQUIRED for confidentiality: if one leg were transparent an
  // observer would derive the confidential leg's amount from the public swap ratio
  // (the order price). A confidential offer MUST use SameChainTerms (the interactive
  // co-sign rail: the covenant rail introspects EXPLICIT amounts and is
  // CT-incompatible), MUST publish maker_blinding_pub + a blinded (blech32) receive
  // address, and MUST NOT involve the BTC sentinel (the parent chain has no CT).
  // Being part of the signed canonical bytes, the namespace is authenticated by
  // maker_sig automatically. Transparent-by-default: an offer with this unset (the
  // proto3 default false) rests in the existing unblinded book, unchanged.
  bool confidential = 19;

  // Settlement variant. Reserved field numbers keep future variants additive.
  oneof settlement {
    SameChainTerms  same_chain  = 20;
    CrossChainTerms cross_chain = 21;
    LightningTerms  lightning   = 22; // submarine, pure-LN and sub-asset rails (ln_direction)
    CovenantTerms   covenant    = 23; // funded, self-enforcing resting order (passive CLOB)
  }

  // secp256k1 signature by maker_pubkey over the canonical serialization of all
  // fields above INCLUDING the whole settlement oneof, so every (current and
  // future) settlement variant is authenticated by construction.
  bytes maker_sig = 31;
}

message SameChainTerms {
  string maker_recv_address = 1; // where the taker pays want_asset (blinded only for a confidential offer)
  string maker_blinding_pub = 2; // lets the taker blind the maker's output
}

message CrossChainTerms {
  string btc_sentinel       = 1; // which leg is BTC
  string maker_claim_pub    = 2;
  string maker_refund_pub   = 3;
  uint32 maker_leg_locktime = 4; // maker's CLTV (longer leg if maker funds BTC)
  string maker_recv_address = 5;
  uint32 direction          = 6; // 0 = BTC_TO_ASSET, 1 = ASSET_TO_BTC
}

// Reserved for the LN/submarine-swap phases. Defined now for additive evolution;
// no relay or settlement code consumes it in the on-chain phases.
message LightningTerms {
  uint32 ln_direction              = 1; // 0 = ASSET_ONCHAIN_FOR_BTC_LN, 1 = BTC_LN_FOR_ASSET_ONCHAIN
  bytes  maker_claim_pub           = 2;
  bytes  maker_refund_pub          = 3;
  uint32 onchain_cltv              = 4; // CLTV on the asset HTLC (shorter leg)
  bool   maker_issues_hold_invoice = 5;
  uint64 max_0conf_amount          = 6; // per-offer 0-conf cap for the on-chain leg
}

// CovenantTerms is a FUNDED, self-enforcing resting order: the maker locks N
// atoms of asset A in ONE taproot UTXO (internal key NUMS => no key-path spend;
// tree {FILL, REFUND}) and can then go OFFLINE. ANYONE who pays the maker the
// baked-in price of asset B may spend it — enforced entirely by the tapscript
// interpreter (see seqob_covenant.py / feature_seqob_covenant_fill.py). Unlike
// the interactive settlement variants, the offer here is NOT a signed price
// PROMISE the maker must later co-sign: it is a POINTER to the on-chain UTXO
// plus the exact commitment a taker re-derives and verifies without trusting the
// relay (reconstruct the taproot output key from internal_key + the FILL-leaf
// constants + merkle_path, confirm it equals the on-chain scriptPubKey). The
// order IS the coin, so oversell is impossible (first spend wins). maker_sig on
// the enclosing Offer still authenticates the POSTER for relay rate-limiting /
// cancel, but is not load-bearing for settlement correctness (the chain is
// authoritative). Design: docs/simplicity-dex-covenant-offers-design.md
// section 4 (the design space; the shipped leaf is tapscript, pkg/covenant).
message CovenantTerms {
  string covenant_txid       = 1;  // the funded taproot UTXO (display txid hex)
  uint32 covenant_vout       = 2;

  // Order constants baked into the FILL leaf (INTERNAL byte order, as on-chain
  // introspection returns them). asset_a rests; asset_b pays for it.
  string asset_a             = 3;  // 32-byte internal-order asset id hex
  string asset_b             = 4;  // 32-byte internal-order asset id hex
  uint64 rate_num            = 5;  // required_B = ceil(filled * rate_num / rate_den)
  uint64 rate_den            = 6;
  bytes  maker_prog          = 7;  // maker credit witness program (32 bytes for v1): a plain key, never an Arca leaf or board script
  uint32 maker_prog_ver      = 8;  // witness version of the maker credit output (1)
  uint64 min_lot             = 9;  // dust-griefing floor on filled and on any remainder

  // REFUND leaf: <expiry_locktime> CLTV DROP <maker_x> CHECKSIG.
  uint32 expiry_locktime     = 10; // absolute CLTV the maker reclaims after: a height below 500,000,000, a median time past (unix seconds) from it
  bytes  maker_x             = 11; // maker x-only key (32 bytes) authorizing REFUND

  // Taproot reconstruction inputs. internal_key is the 32-byte x-only internal
  // key (NUMS by default; a NON-NUMS key is a maker-cancellable/key-path-rug
  // offer a taker MUST treat with suspicion). merkle_path is the control-block
  // merkle branch (sibling hashes) proving the FILL leaf under the output key.
  bytes  internal_key        = 12; // 32-byte x-only internal key (NUMS default)
  repeated bytes merkle_path = 13; // taproot merkle branch (32-byte sibling hashes)
}

// A signed cancel. nonce defeats replay against a re-posted same offer_id.
message OfferCancel {
  string offer_id     = 1;
  string maker_pubkey = 2;
  uint64 nonce        = 3;
  bytes  sig          = 4; // by maker_pubkey over {offer_id, maker_pubkey, nonce}
}
