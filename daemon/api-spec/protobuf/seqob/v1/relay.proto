syntax = "proto3";

// SeqOB relay wire protocol. The relay is a non-custodial matchmaker + message
// courier: it stores signed offers, serves the per-pair book (snapshot + deltas),
// and pipes opaque, end-to-end-encrypted swap-session messages between two peers.
// It never holds keys, never signs, never blinds, never holds a spendable PSET,
// never broadcasts user funds, and never decrypts the courier payload.
package seqob.v1;

import "seqob/v1/offer.proto";

message Empty {}

message OfferRef {
  string offer_id     = 1;
  string maker_pubkey = 2;
}

message Market {
  AssetPair pair       = 1;
  double best_bid      = 2;
  double best_ask      = 3;
  double last_price    = 4;
  uint64 n_orders      = 5;
}

message MarketList { repeated Market markets = 1; }

// Per-pair order book (also a maker's own orders, and the WebSocket snapshot).
// offers are the makers' signed offers, byte for byte. statuses[i] is the
// relay's live state of offers[i]: its active_amount is the base atoms the order
// can be filled for now, which is what a book shows as its size. For a covenant
// order that is what its outpoint holds: after a part fill the order rests at its
// remainder, below the offer_amount it was signed for, and while a fill of it is
// unconfirmed it is 0. offer_amount stays the maker's signed figure.
message PublicBook {
  AssetPair pair        = 1;
  repeated Offer offers = 2; // signed; any client can verify independently
  repeated OrderStatus statuses = 3; // one per offer, in the same order
}

// A taker lifts a chosen resting offer. taker_session_pubkey is the ephemeral key
// the maker encrypts the swap-session payload to (and vice versa), so the relay
// only ever couriers ciphertext.
message StartLift {
  string offer_id            = 1;
  string maker_pubkey        = 2;
  uint64 take_amount         = 3; // base atoms; <= base_amount (partial if allow_partial)
  string taker_fee_asset     = 4; // open fee market (Principle 4)
  bytes  taker_session_pubkey = 5;
  // Taker-side execution option (additive; default 0 = GTC). The take field for the
  // continuous-matcher order options: a taker walking the book across several lifts can
  // ask for IOC (take what is available now, do not wait) or FOK (take the full
  // requested size in one shot or nothing). POST_ONLY is meaningless for a lift (a lift
  // is by definition a take), so it is rejected on a StartLift.
  TimeInForce time_in_force = 6;
}

// Relay confirms a lift session is open and binds the two peers. Carries the
// maker's session pubkey (the maker's offer key, which the taker already knows)
// so the taker can derive the E2E key and seal its swap half to it.
message LiftAccepted {
  string session_id          = 1;
  bytes  maker_session_pubkey = 2;
}

// Relay -> maker: a taker has lifted one of the maker's resting offers. Carries
// the taker's session pubkey so the maker can derive the E2E key (ECDH with the
// maker's offer key) and open the taker's sealed SwapRequest, plus the lift
// terms. The relay only notifies; it never decrypts or holds anything.
message LiftRequested {
  string session_id          = 1;
  string offer_id            = 2;
  string maker_pubkey        = 3;
  uint64 take_amount         = 4;
  bytes  taker_session_pubkey = 5;
}

// Matched generalizes LiftRequested: the relay's continuous matching engine
// crossed an incoming order against a resting one (price-time priority), so the
// counterparty can settle. It carries the session id, the recipient's ROLE, and
// the fill size/price. For a COVENANT resting order the maker is offline and no
// round-trip is possible: the message additionally carries the covenant fields
// the counterparty (taker) needs to build + broadcast the permissionless FILL
// spend itself, so settlement needs nobody online but the taker.
message Matched {
  string   session_id       = 1; // match/session id (couriered settlement, if any)
  string   offer_id         = 2; // the RESTING order that was crossed
  string   maker_pubkey     = 3; // its maker
  string   role             = 4; // recipient's role: "taker" or "maker"
  uint64   fill_base_amount = 5; // base atoms filled by this match
  uint64   fill_quote_amount = 6; // quote atoms owed for the fill (ceil price)
  bool     resting_is_covenant = 7; // if true, settle via the covenant FILL spend below
  // Present iff resting_is_covenant: the resting order's on-chain covenant terms
  // and this fill's derived recipe (required_b, credit/remainder output indices).
  CovenantTerms covenant    = 8;
  uint64   covenant_locked  = 9;  // atoms of A currently locked in the covenant UTXO
}

// Opaque end-to-end-encrypted swap-session payload (review B1). The relay routes
// ciphertext by session_id between the two peers; it does NOT decrypt, parse, or
// introspect it, so confidential amounts and blinders never reach the relay.
// The plaintext is an inner seqdex swap.proto message (SwapRequest / SwapAccept /
// SwapComplete) for same-chain, or HTLC leg notices for cross-chain.
message SwapMsg {
  string session_id = 1;
  bytes  ciphertext = 2;
}

// Client (the MAKER of a lifted resting order) -> relay: the interactive lift for
// session_id has settled on-chain at settle_txid, filling fill_base base atoms. The
// relay is otherwise blind to the opaque SwapMsg courier, so this ack is the ONLY
// signal that lets it record the trade, decrement the resting order, and close the
// session (without it the resting order lingers as a ghost and the trades feed stays
// empty for every interactive lift). MAKER-authenticated (see wsSettleAck): only the
// session's maker may send it — the maker has no incentive to falsely decrement its
// own resting order, whereas trusting the taker would let any taker grief a live
// order. settle_txid is on-chain (public), so this leaks nothing the chain does not.
message SettleAck {
  string session_id  = 1;
  string settle_txid = 2;
  uint64 fill_base   = 3; // base atoms actually settled (== the lift's take_amount)
  uint32 anchor_confs = 4; // Bitcoin-anchor confirmations the maker declares for settle_txid; a fill with anchor_confs >= min_anchor_depth reaches FILLED (0 keeps the 0-conf-tolerant default)
}

// Client (the MAKER of a resting CROSS-CHAIN or LIGHTNING offer) -> relay: a lift of
// this offer SETTLED off the opaque courier path, filling fill_base base atoms at
// settle_txid with anchor_confs Bitcoin-anchor confirmations. It is the SettleAck
// analogue for durable settlement types, but keyed to the OFFER (not a session) and
// MAKER-SIGNED rather than session-authorized: a cross/LN swap can finish AFTER the
// short co-sign session was swept (its on-chain / Lightning leg outlives the courier
// deadline) or after the maker reconnected (dropping the in-memory session role), so
// a session-scoped ack is unreachable at settlement time. The relay verifies sig
// against maker_pubkey, then records the trade at the RESTING order's price and
// decrements/finalizes it (advancing anchor_confs so a min_anchor_depth>0 offer can
// reach FILLED). nonce is strictly increasing (defeats replay of an old settled-trade
// against a re-posted same offer_id, which -requote reuses). Reorg retraction of a
// recorded trade is handled separately (the anchor/covenant watcher).
message SettledTrade {
  string offer_id     = 1;
  string maker_pubkey = 2;
  uint64 fill_base    = 3; // base atoms settled (a partial fill for an allow_partial offer, else the whole size)
  string settle_txid  = 4; // on-chain settling txid (empty / informational for a pure-Lightning fill)
  uint32 anchor_confs = 5; // Bitcoin-anchor confirmations of settle_txid the maker declares final (0 for pure-LN)
  uint64 nonce        = 6; // strictly-increasing replay guard (wall-clock ns), like OfferCancel
  bytes  sig          = 7; // by maker_pubkey over {offer_id, maker_pubkey, fill_base, settle_txid, anchor_confs, nonce}
}

// Client -> relay: re-attach a RECONNECTED websocket to a still-live lift session
// after a WS drop (P3.8). The session's role was bound to the OLD socket, so a fresh
// WS otherwise 403s on the first swap_msg. The original participant re-proves control
// of the session key it already holds: sig is a secp256k1 signature over
// sha256("seqob-reattach|" || session_id || "|" || role) by that key — the maker's
// OFFER key (== maker_pubkey) for role "maker", the ephemeral taker_session_pubkey for
// role "taker". The relay verifies the session exists and the signature matches the
// bound key, then re-binds this connection to the session (delivering couriered frames).
message SessionReattach {
  string session_id = 1;
  string role       = 2; // "taker" or "maker"
  bytes  sig        = 3;
}

// relay -> client: a SessionReattach succeeded; this connection is re-bound to the
// session and will again receive couriered swap_msg frames for it.
message SessionReattached {
  string session_id = 1;
  string role       = 2;
}

// relay -> a book subscriber: the relay DROPPED at least one delta for this
// subscriber (its delivery buffer overflowed on a burst), so its view may be stale
// (P3.8). The client MUST re-fetch the pair snapshot (REST orderbook or a fresh
// market_subscribe). next_seq is the sequence the subscriber's stream resumes at.
message Resync {
  AssetPair pair     = 1;
  uint64    next_seq = 2;
}

enum OfferStatus {
  OFFER_STATUS_UNSPECIFIED      = 0;
  OFFER_STATUS_OPEN             = 1;
  OFFER_STATUS_PARTIAL          = 2;
  OFFER_STATUS_FILLED           = 3; // only after the settling tx reaches min_anchor_depth Bitcoin confs
  OFFER_STATUS_CANCELLED        = 4;
  OFFER_STATUS_EXPIRED          = 5;
  OFFER_STATUS_UTXO_INVALIDATED = 6; // maker could not co-sign (coins moved); dropped, no on-chain cost
}

message OrderStatus {
  string offer_id      = 1;
  string maker_pubkey  = 2;
  OfferStatus status   = 3;
  uint64 active_amount = 4; // remaining base atoms after partials
  string settle_txid   = 5; // set when settling; FILLED only after anchor depth
  uint32 anchor_confs  = 6; // Bitcoin-anchor confirmations of settle_txid so far
  // Soft oversell flag (P3.10): true when this INTERACTIVE offer's offer_amount pushed
  // the maker's cumulative committed capital in this offer_asset past the relay's soft
  // per-maker cap — i.e. it is likely phantom depth backed by coins already committed
  // to the maker's earlier live offers. Advisory only (the relay cannot see confidential
  // balances): the offer still rests and can still be lifted, but a book/UI should
  // down-weight demoted depth. Covenant offers are funded on-chain and never demoted.
  bool demoted = 7;
}

message GenericError {
  uint32 code = 1;
  string message = 2;
}

// client -> relay
message To {
  oneof msg {
    AssetPair   market_subscribe   = 100;
    AssetPair   market_unsubscribe = 101;
    Offer       offer_submit       = 102;
    Offer       offer_edit         = 103; // re-signed, same offer_id
    OfferCancel offer_cancel       = 104;
    StartLift   start_lift         = 113;
    SettleAck   settle_ack         = 114; // maker: interactive lift settled (record + decrement + close)
    SettledTrade settled_trade     = 115; // maker: durable cross/LN lift settled (session-independent, maker-signed record + decrement)
    SessionReattach session_reattach = 116; // re-bind a reconnected WS to a live session (P3.8)
    SwapMsg     swap_msg           = 130; // opaque courier passthrough
    Empty       list_markets       = 150;
  }
}

// relay -> client
message From {
  oneof msg {
    MarketList   market_list          = 150;
    PublicBook   public_book          = 105; // snapshot
    Offer        public_order_created = 106; // delta
    OfferRef     public_order_removed = 107; // delta
    Resync       resync               = 108; // book subscriber: deltas were dropped, re-snapshot (P3.8)
    SessionReattached session_reattached = 109; // WS re-bound to a live session (P3.8)
    LiftAccepted lift_accepted        = 142;
    LiftRequested lift_requested      = 143; // relay -> maker: a taker lifted your offer
    Matched      matched              = 144; // relay -> peer: the matcher crossed two orders
    SwapMsg      swap_msg             = 131; // opaque courier passthrough
    OrderStatus  order_status         = 160;
    GenericError error                = 200;
  }
  // Monotonic per-subscription sequence number of a book DELTA
  // (public_order_created / public_order_removed / order_status forwarded to a
  // subscriber). 0 on snapshots, direct replies, and courier/session messages. A
  // subscriber that sees seq skip a value missed a delta (the relay dropped it on a
  // buffer overflow) and MUST re-snapshot; the relay also proactively sends Resync.
  uint64 seq = 210;
}
