# Build both modules and run their Go tests on every pull request and on main, on Go 1.25.0,
# the Go the testnet server builds the daemons with.
#
# Not run here, by design (CLAUDE.md, "Build and test"):
# - SKIPPED (needs a regtest stack): daemon/test/e2e (`make integrationtest`), and every test
#   gated on SEQDEX_XCHAIN_*, SEQDEX_BTC_REGTEST, SEQLN_* or TEST_*_ENDPOINT; those skip
#   themselves when the variable is unset.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The wallet's storage tests run against Postgres as well as badger and in-memory, with the
    # credentials of `make pg` (wallet/Makefile), which are local-only test values.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: oceand-db-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            daemon/go.sum
            wallet/go.sum
      - name: build
        run: |
          (cd daemon && go build ./...)
          (cd wallet && go build ./...)
      - name: daemon tests
        working-directory: daemon
        run: go test $(go list ./... | grep -v '/test/e2e')
      - name: wallet tests
        working-directory: wallet
        # the packages that read the daemon's configuration stop at start-up without a native
        # asset; any 32-byte hex serves the tests
        env:
          OCEAN_NATIVE_ASSET: abababababababababababababababababababababababababababababababab
        run: OCEAN_DATADIR=$(mktemp -d) go test ./...
